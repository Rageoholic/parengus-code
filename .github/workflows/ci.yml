name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.tasks/**'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**.md'
              - '!.tasks/**'

  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --all

  check:
    name: Check (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
            [ asset-compiler, asset-loader, asset-pipeline,
              asset-shared, parengus-tracing, phoenix, rgpu-vk,
              samp-app, samp-app-noext, xtask ]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
      - run: >-
          cargo clippy -p ${{ matrix.package }}
          --all-targets -- -D warnings

  check-workspace:
    name: Workspace build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
      - run: cargo build --workspace --all-targets

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
      - run: cargo test --workspace

  all-checks:
    name: All checks passed
    needs: [fmt, check, check-workspace, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [[ \
            "${{ contains(needs.*.result, 'failure') }}" == "true" \
            || "${{ contains(needs.*.result, 'cancelled') }}" == "true" \
          ]]; then
            exit 1
          fi
